
background {
    path = ~/.config/hypr/wallpapers/hyprlock
    blur_passes = 4
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

animations {
    enabled = true
}

label {
    monitor =
     text = cmd[update:1000] echo "$(date +"%-I:%M%p")"
    color = rgba(255, 255, 255, 0.8)
    font_size = 100
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, -90
    halign = center
    valign = top
}

label {
    monitor =
    text = Hello, $USER
    color = rgba(255, 255, 255, .8)
    font_size = 25
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 62
    rounding = 5
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 1.0
    dots_center = true
    outer_color = rgba(207, 207, 207, 0.6)
    inner_color = rgba(64, 64, 64, 0.4)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font Propo
    placeholder_text = <i><span foreground="##ffffff99"></span></i>
    hide_input = false
    position = 0, -75
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/songdetail.sh)" 
    color = rgba(200, 200, 200, .75)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 80
    halign = center
    valign = bottom
}
